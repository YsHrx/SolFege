<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ea" />
    <meta name="description" content="Entraînement au solfège pour violonistes : un chemin d'apprentissage, et des exercices à la carte — lecture de notes, rythme, intervalles." />
    <title>SolFège — entraînement violon</title>

    <!-- Les polices sont auto-hébergées et déclarées dans src/index.css.
         Aucune requête vers un CDN : l'application garde sa typographie
         derrière un réseau filtré, et rien ne fuite vers un tiers.
         On les précharge ici pour éviter le clignotement au démarrage. -->
    <link rel="preload" href="/fonts/baloo2-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plexsans-400.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SolFège" />

    <!-- Le thème est posé AVANT le premier rendu. React ne pourrait le
         faire qu'après, et l'application s'ouvrirait une fraction de
         seconde en papier blanc avant de basculer en ardoise — ce qui,
         pour une application qu'on rouvre le soir, est le pire moment
         possible pour prendre un flash de blanc. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("solfege_v5") || "{}");
          var choice = (saved.settings && saved.settings.theme) || "systeme";
          var dark = choice === "ardoise" || (choice === "systeme"
            && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "ardoise" : "papier";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#1a211d" : "#fbf7ea");
        } catch (e) { /* sauvegarde illisible : le thème clair fera l'affaire */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
