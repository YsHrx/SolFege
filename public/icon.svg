<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SolFège">
  <!-- La croche, la mascotte de l'application : gros contour d'encre,
       aplat posé légèrement de travers, aucun dégradé. -->
  <rect width="512" height="512" rx="112" fill="#fbf7ea"/>

  <!-- lignes de portée, en fond -->
  <g fill="#cbbf9e">
    <rect x="44" y="176" width="424" height="9"/>
    <rect x="44" y="224" width="424" height="9"/>
    <rect x="44" y="272" width="424" height="9"/>
    <rect x="44" y="320" width="424" height="9"/>
    <rect x="44" y="368" width="424" height="9"/>
  </g>

  <!-- hampe et crochet -->
  <path d="M338 336V116" stroke="#17160f" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M338 124c52 24 66 62 58 110" stroke="#17160f" stroke-width="30"
        stroke-linecap="round" fill="none"/>

  <!-- tête : l'aplat déborde de 6 px, comme un coloriage au feutre -->
  <ellipse cx="222" cy="342" rx="96" ry="74" transform="rotate(-12 228 348)" fill="#dfa321"/>
  <ellipse cx="228" cy="336" rx="96" ry="74" transform="rotate(-12 228 336)"
           fill="none" stroke="#17160f" stroke-width="26"/>

  <circle cx="200" cy="326" r="15" fill="#17160f"/>
  <circle cx="266" cy="336" r="15" fill="#17160f"/>
  <path d="M204 372q22 16 44 4" stroke="#17160f" stroke-width="14"
        stroke-linecap="round" fill="none"/>
</svg>
